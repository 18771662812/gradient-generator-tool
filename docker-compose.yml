services:
  opengauss:
    image: enmotech/opengauss:latest
    container_name: gradient-db
    privileged: true
    user: root
    shm_size: 1g
    environment:
      GS_PASSWORD: OpenGauss@2024
      GS_USERNAME: gaussdb
      GS_PORT: 5432
      GS_DB: postgres
      PGPASSWORD: OpenGauss@2024
    ports:
      - "15432:5432"
    volumes:
      - opengauss-data:/var/lib/opengauss
    networks:
      - gradient-network
    healthcheck:
      test: ["CMD-SHELL", "LD_LIBRARY_PATH=/usr/local/opengauss/lib /usr/local/opengauss/bin/gsql -U gaussdb -d postgres -c 'SELECT 1'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gradient-backend
    environment:
      DATABASE_HOST: opengauss
      DATABASE_PORT: 5432
      DATABASE_NAME: postgres
      DATABASE_USER: gaussdb
      DATABASE_PASSWORD: OpenGauss@2024
      JWT_SECRET: your-secret-key-change-in-production-2024
      FLASK_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      opengauss:
        condition: service_healthy
    networks:
      - gradient-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gradient-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - gradient-network
    restart: unless-stopped

networks:
  gradient-network:
    driver: bridge

volumes:
  opengauss-data:
