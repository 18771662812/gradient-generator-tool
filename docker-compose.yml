services:
  opengauss:
    image: enmotech/opengauss:5.0.0
    container_name: gradient-db
    privileged: true
    user: root
    shm_size: 4g          
    environment:
      GS_PASSWORD: OpenGauss@2024
      GS_PORT: 5432
    ports:
      - "15432:5432"
    volumes:
      - opengauss-data:/var/lib/opengauss
    networks:
      - gradient-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/5432' 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 60s   

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gradient-backend
    environment:
      DATABASE_HOST: opengauss
      DATABASE_PORT: 5432
      DATABASE_NAME: omm
      DATABASE_USER: gaussdb
      DATABASE_PASSWORD: OpenGauss@2024
      JWT_SECRET: your-secret-key-change-in-production-2024
      FLASK_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      opengauss:
        condition: service_healthy
    networks:
      - gradient-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gradient-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - gradient-network
    restart: unless-stopped

networks:
  gradient-network:
    driver: bridge

volumes:
  opengauss-data: